<!DOCTYPE html>
<html>

<head>

    <title>Safe Route Finder</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input {
            padding: 10px;
            width: 300px;
            margin: 8px 0;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            width: 350px;
        }

        #map {
            margin-top: 20px;
            width: 100%;
            height: 450px;
        }

    </style>

</head>

<body>

<h1>🌍 Tourist Safety System</h1>

<a href="/dashboard">Dashboard</a> |
<a href="/location">Live Location</a> |
<a href="/profile">Profile</a> |
<a href="/logout">Logout</a>

<hr>

<h2>🗺️ Safe Route Finder</h2>

<p>Choose the safest route for your journey.</p>


<h3>📍 Current Location</h3>

<input
    type="text"
    id="start"
    placeholder="Example: Chennai"
>


<h3>📍 Destination</h3>

<input
    type="text"
    id="destination"
    placeholder="Example: Bangalore"
>

<br><br>

<button onclick="findSafeRoute()">
    🚗 Find Safe Route
</button>


<div id="result"></div>


<div id="map"></div>


<script>

async function findSafeRoute() {

    const start =
        document.getElementById("start").value.trim();

    const destination =
        document.getElementById("destination").value.trim();


    if (start === "" || destination === "") {

        alert("Please enter current location and destination.");

        return;
    }


    document.getElementById("result").innerHTML =
        "⏳ Finding route...";


    try {

        const response = await fetch(
            `/api/safe-route?start=${encodeURIComponent(start)}&destination=${encodeURIComponent(destination)}`
        );


        const data = await response.json();


        if (!response.ok) {

            document.getElementById("result").innerHTML =
                "❌ " + (data.error || "Unable to find route.");

            return;
        }


        document.getElementById("result").innerHTML = `

            <h3>✅ Route Found</h3>

            <p>
                <b>Distance:</b>
                ${data.distance_km} km
            </p>

            <p>
                <b>Estimated Time:</b>
                ${data.duration_minutes} minutes
            </p>

            <p>
                <b>Status:</b>
                Safe route calculated successfully.
            </p>

        `;


        // Open Google Maps route

        const mapsURL =
            "https://www.google.com/maps/dir/" +
            encodeURIComponent(start) +
            "/" +
            encodeURIComponent(destination);

        document.getElementById("map").innerHTML = `

            <br>

            <a href="${mapsURL}" target="_blank">

                <button>
                    📍 Open Route in Google Maps
                </button>

            </a>

        `;


    }

    catch (error) {

        document.getElementById("result").innerHTML =
            "❌ Error connecting to server.";

        console.log(error);

    }

}

</script>


</body>

</html>
